<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKX reachability probe</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--panel:#0e131b;--line:#1d2634;--tx:#dbe3ee;--mut:#66748a;
      --grn:#00d68f;--red:#ff4d6a;--amb:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',monospace;
     font-size:13px;line-height:1.6;padding:16px;max-width:820px;margin:0 auto}
h1{font-size:16px;letter-spacing:.1em;margin-bottom:4px}
p.lead{color:var(--mut);font-size:12px;margin-bottom:16px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:9px;
     padding:11px 13px;margin-bottom:8px;word-break:break-all}
.row .t{font-weight:700;margin-bottom:3px}
.ok{color:var(--grn)} .bad{color:var(--red)} .wait{color:var(--amb)}
.det{color:var(--mut);font-size:11.5px;margin-top:4px;white-space:pre-wrap}
button{background:var(--line);border:0;color:var(--tx);font:700 12px 'JetBrains Mono',monospace;
       padding:9px 16px;border-radius:7px;margin-top:12px}
#sum{margin-top:16px;padding:13px;border-radius:9px;border:1px solid var(--line);
     background:var(--panel);font-size:12.5px;line-height:1.65;display:none}
</style>
</head>
<body>
<h1>OKX PROBE</h1>
<p class="lead" id="ctx"></p>
<div id="out"></div>
<button onclick="location.reload()">Run again</button>
<div id="sum"></div>

<script>
const out = document.getElementById('out');
document.getElementById('ctx').textContent =
  location.origin + '  ·  ' + new Date().toISOString();

const TESTS = [
  {n:'www.okx.com  server time',  u:'https://www.okx.com/api/v5/public/time'},
  {n:'aws.okx.com  server time',  u:'https://aws.okx.com/api/v5/public/time'},
  {n:'www.okx.com  15m candles  BTC-USDT-SWAP',
   u:'https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=15m&limit=3'},
  {n:'control: github api (proves general egress)', u:'https://api.github.com/zen'}
];

const results = [];

function row(t){
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<div class="t">${t}</div><div class="s wait">testing…</div><div class="det"></div>`;
  out.appendChild(d);
  return d;
}

async function probe(test){
  const el = row(test.n);
  const s = el.querySelector('.s'), det = el.querySelector('.det');
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 12000);
  try {
    const r = await fetch(test.u, {signal: ctl.signal});
    clearTimeout(timer);
    const ms = Math.round(performance.now()-t0);
    const body = (await r.text()).slice(0, 240);
    if (r.ok){
      s.className = 's ok'; s.textContent = `OK  ${r.status}  ${ms}ms`;
      results.push({t:test.n, ok:true});
    } else {
      s.className = 's bad'; s.textContent = `HTTP ${r.status}  ${ms}ms`;
      results.push({t:test.n, ok:false, kind:'http'+r.status});
    }
    det.textContent = body;
  } catch (e){
    clearTimeout(timer);
    const ms = Math.round(performance.now()-t0);
    s.className = 's bad';
    const kind = e.name === 'AbortError' ? 'timeout' : e.name;
    s.textContent = `${kind}  ${ms}ms`;
    det.textContent = e.message +
      '\n(a bare "Load failed" / TypeError here almost always means CORS or a blocked connection — ' +
      'the browser hides the real reason)';
    results.push({t:test.n, ok:false, kind});
  }
}

(async ()=>{
  for (const t of TESTS) await probe(t);
  const ex = results.filter(r=>/okx/.test(r.t));
  const ctrl  = results.find(r=>/github/.test(r.t));
  const sum = document.getElementById('sum');
  sum.style.display = 'block';
  if (ex.every(r=>r.ok)){
    sum.innerHTML = '<span class="ok">OKX is reachable from this device and network.</span><br>' +
      'The dashboard failing is then a bug in the page, not connectivity. Send me this screenshot.';
  } else if (ctrl && !ctrl.ok){
    sum.innerHTML = '<span class="bad">Nothing is reachable</span>, including the control host. ' +
      'This is your network or a content blocker, not OKX specifically.';
  } else if (ex.some(r=>r.kind && r.kind.startsWith('http'))){
    sum.innerHTML = '<span class="bad">OKX answered but refused.</span> ' +
      'An HTTP 403 here means geographic restriction. A different exchange feed would be needed.';
  } else {
    sum.innerHTML = '<span class="bad">OKX connections fail while the control host works.</span> ' +
      'That points at OKX being blocked on this network or by a content/privacy blocker ' +
      '(iOS Safari extensions, private relay, DNS filtering, VPN).';
  }
})();
</script>
</body>
</html>
